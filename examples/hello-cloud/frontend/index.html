<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云端回声 · pi-aliyun</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <header><a href="./">pi-aliyun</a><span>一次真实的云端往返</span></header>
  <main>
    <section class="intro">
      <p class="eyebrow">OSS + FC · HTTPS</p>
      <h1>发出一句话，<br>听见云端回声。</h1>
      <p class="description">这个页面来自 OSS。你的消息将发送到 FC，再带着服务端时间回到这里。</p>
      <div class="route" aria-label="页面通过 HTTPS 调用云端接口"><span>你的浏览器</span><i aria-hidden="true">⇄</i><span>云端函数</span></div>
    </section>
    <section class="conversation" aria-label="云端回声演示">
      <form id="echo-form">
        <label for="message">发给云端</label>
        <textarea id="message" name="message" maxlength="200" required rows="3">你好，阿里云。</textarea>
        <div class="form-footer"><span>不保存消息 · 最多 200 字</span><button id="send" disabled>发送并接收回声 <span aria-hidden="true">↗</span></button></div>
      </form>
      <div class="reply" aria-live="polite" aria-atomic="true">
        <p class="reply-label" id="status">正在准备连接</p>
        <p class="reply-message" id="reply">你的第一条回声，会出现在这里。</p>
        <dl id="details" hidden><div><dt>服务端时间</dt><dd id="time"></dd></div><div><dt>本次往返</dt><dd id="latency"></dd></div><div class="request"><dt>请求编号</dt><dd id="request-id"></dd></div></dl>
      </div>
    </section>
  </main>
  <footer><span>前端与后端，独立部署。</span><a id="health-link" hidden target="_blank" rel="noopener">查看接口健康状态 ↗</a></footer>
</body>
</html>
